name: catalog-service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Test
      run: ./mvnw -B verify
    - name: OpenAPI spec
      run: ./mvnw -B -Popenapi test
    - uses: actions/upload-artifact@v4
      with:
        name: catalog-openapi
        path: target/openapi/catalog.json

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t catalog-service:${{ github.sha }} .
    # TODO push to the registry once we have one for this team
