spring.application.name=catalog-service
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${DB_USER:catalog}
spring.datasource.password=${DB_PASSWORD:catalog}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Pinned to 3.0 when springdoc switched its default to 3.1. Nobody has checked the
# clients against 3.1 since, so leave it unless you're doing that.
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
